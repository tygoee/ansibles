- name: Log in as the {{ user.name }} user
  become: true
  become_user: "{{ user.name }}"
  block:
    - name: Copy portainer container file
      ansible.builtin.copy:
        src: quadlets/portainer/portainer.container
        dest: "{{ user.home }}/.config/containers/systemd/"
        mode: "644"

    - name: Enable the podman socket for portainer
      ansible.builtin.systemd:
        daemon_reload: true
        name: podman.socket
        scope: user
        enabled: true
        state: started

    - name: Start portainer
      ansible.builtin.systemd_service:
        name: portainer
        scope: user
        state: started

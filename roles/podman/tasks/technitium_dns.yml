- name: Log in as the dns-server user
  become: true
  become_user: "{{ user.name }}"
  block:
    - name: Copy dns-server container file
      ansible.builtin.copy:
        src: quadlets/technitium-dns/dns-server.container
        dest: "{{ user.home }}/.config/containers/systemd/"
        mode: "644"
        owner: "{{ user.name }}"
        group: "{{ user.group }}"

    - name: Copy templated dns-server environment file
      ansible.builtin.template:
        src: quadlets/technitium-dns/dns-server.env
        dest: "{{ user.home }}/.config/containers/environment/"
        mode: "644"

    - name: Start dns-server
      become: true
      become_user: "{{ user.name }}"
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: dns-server
        scope: user
        state: started

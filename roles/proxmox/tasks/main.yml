- name: Create machines.json
  ansible.builtin.command:
    argv:
      - "/usr/bin/python3"
      - "{{ role_path }}/machines/machines.py"
  changed_when: true

- name: Load machines.json as variables
  ansible.builtin.include_vars:
    file: "{{ role_path }}/machines/machines.json"

- name: Import proxmox setup
  ansible.builtin.import_tasks: proxmox-setup.yml

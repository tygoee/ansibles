        'local-lvm:vm-{{ vmids.almalinux_main }}-disk-1,iothread=1,size=10G'
      set:
        vmid: "{{ vmids.almalinux_main }}"
        disk: scsi0
        size: +30G
        state: resized

  almalinux_media:

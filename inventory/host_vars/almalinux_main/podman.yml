# Containers to install
containers:
  - portainer
  - joplin_server

# Usually user=group and uid=gid. A user always needs the same uid
# Multiple apps with the same user/uid configuration are allowed
users:
  root: &root
    name: root
    group: root
    uid: 0
    gid: 0
    home: /root

  podman: &podman
    name: podman
    group: podman
    uid: 2000
    gid: 2000
    home: /home/podman

  portainer:
    <<: *podman

  joplin_server:
    <<: *root
